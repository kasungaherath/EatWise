name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Scan repository history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          scanner_dir="${RUNNER_TEMP}/eatwise-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "$scanner_dir/$archive"
          cd "$scanner_dir"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"

      - name: Scan all commits without exposing secret values
        run: gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow --max-decode-depth=2 --log-opts="--all --full-history --no-textconv" .
